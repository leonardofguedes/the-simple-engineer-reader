<title>The Simple Engineer</title><style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--mut:#6b6a66;--line:#e4e1da;--acc:#1f5fa8;--err:#a32121}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17171a;--fg:#e8e6e1;--mut:#9a978f;--line:#2c2c31;--acc:#7fb2ee;--err:#f08c8c}}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 'Segoe UI',system-ui,sans-serif;padding:16px}
form{width:100%;max-width:360px}h1{font:700 28px Georgia,serif;margin:0}p{color:var(--mut);margin:4px 0 24px;font-style:italic;font-family:Georgia,serif}

button{width:100%;padding:11px;font:600 15px inherit;font-family:inherit;border:0;border-radius:8px;background:var(--acc);color:var(--bg);cursor:pointer}button:disabled{opacity:.6}
.row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);margin-bottom:14px}#err{color:var(--err);font-size:14px;min-height:21px;margin-top:10px}

<script>
const P=JSON.parse(document.getElementById('p').textContent),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(code){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),c=document.getElementById('c'),r=document.getElementById('r'),btn=document.getElementById('b'),err=document.getElementById('err');
f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;err.textContent='';btn.textContent='Abrindo…';
  try{await open_(c.value);try{r.checked?localStorage.setItem('book-code',c.value):localStorage.removeItem('book-code')}catch(_){}}
  catch(_){err.textContent='Código incorreto.';btn.disabled=false;btn.textContent='Abrir o livro';c.select()}};
let saved=null;try{saved=localStorage.getItem('book-code')}catch(_){}
if(saved){r.checked=true;open_(saved).catch(()=>{try{localStorage.removeItem('book-code')}catch(_){}})}
</script></body></html>
